<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Dashboard — GBM CC Fase II</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:'Inter',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#111 0%,#1a1a2e 50%,#1c1408 100%);padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222}
.header .logos{display:flex;align-items:center;gap:1rem}
.header .logos img{height:28px}
.header .logos .divider{width:1px;height:24px;background:#444}
.header .title{font-family:'Sora',sans-serif;font-size:1.1rem;color:#fff;font-weight:600}
.header .sub{font-size:.72rem;color:#888}
.header .updated{font-size:.65rem;color:#555}

.tabs{display:flex;gap:0;background:#111;border-bottom:1px solid #222;padding:0 2rem}
.tab{padding:.8rem 1.5rem;font-size:.8rem;font-weight:500;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#ccc}
.tab.active{color:#FF9900;border-bottom-color:#FF9900}

.content{padding:1.5rem 2rem;max-width:1200px;margin:0 auto}
.view{display:none}
.view.active{display:block}

.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-bottom:1.5rem}
.stat{background:#141414;border:1px solid #222;border-radius:8px;padding:1rem;text-align:center}
.stat .val{font-family:'Sora',sans-serif;font-size:1.6rem;font-weight:700}
.stat .val.orange{color:#FF9900}
.stat .val.green{color:#22c55e}
.stat .val.blue{color:#448AFF}
.stat .val.red{color:#ef4444}
.stat .val.purple{color:#B388FF}
.stat .lbl{font-size:.68rem;color:#888;margin-top:.2rem}

.section{margin-bottom:1.5rem}
.section-title{font-family:'Sora',sans-serif;font-size:.9rem;font-weight:600;color:#fff;margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem}
.dot{width:6px;height:6px;border-radius:50%}

table{width:100%;border-collapse:collapse;font-size:.78rem}
th{font-family:'Sora',sans-serif;font-size:.65rem;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;padding:.6rem .8rem;border-bottom:1px solid #222;text-align:left}
td{padding:.6rem .8rem;border-bottom:1px solid #1a1a1a}
tr:hover{background:#141414}
.key{font-family:'Sora',sans-serif;font-weight:600;color:#448AFF;font-size:.72rem}
.badge{font-size:.65rem;padding:.15rem .5rem;border-radius:10px;font-weight:500;white-space:nowrap}
.badge-done{color:#22c55e;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2)}
.badge-progress{color:#FF9900;background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.2)}
.badge-todo{color:#888;background:rgba(136,136,136,.08);border:1px solid rgba(136,136,136,.2)}
.badge-blocked{color:#ef4444;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2)}

.progress-bar{background:#222;border-radius:6px;height:6px;overflow:hidden;width:100%}
.progress-fill{height:100%;border-radius:6px}
.fill-green{background:linear-gradient(90deg,#22c55e,#69F0AE)}
.fill-orange{background:linear-gradient(90deg,#FF9900,#FFB74D)}
.fill-blue{background:linear-gradient(90deg,#448AFF,#82B1FF)}

.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.col-card{background:#141414;border:1px solid #222;border-radius:8px;padding:1rem;max-height:400px;overflow-y:auto}
.col-card h3{font-family:'Sora',sans-serif;font-size:.78rem;font-weight:600;margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem}
.col-card ul{list-style:none}
.col-card li{padding:.4rem 0;border-bottom:1px solid #1a1a1a;font-size:.72rem;display:flex;align-items:center;gap:.4rem}
.col-card li .key{min-width:50px}

.epic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.epic-card{background:#141414;border:1px solid #222;border-radius:8px;padding:1rem}
.epic-card .name{font-family:'Sora',sans-serif;font-size:.8rem;font-weight:600;color:#fff;margin-bottom:.3rem}
.epic-card .meta{font-size:.68rem;color:#888;margin-bottom:.4rem}

.sprint-row{cursor:pointer}
.sprint-row:hover{background:#1a1a1a}
.story-block{background:#141414;border:1px solid #222;border-radius:8px;padding:.8rem;margin-bottom:.6rem}
.story-block .story-title{font-family:'Sora',sans-serif;font-size:.78rem;font-weight:600;color:#fff;margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem}
.story-block .story-title .type-icon{width:14px;height:14px;border-radius:3px}
.story-block .subtask-list{list-style:none;padding-left:1.2rem;border-left:2px solid #333}
.story-block .subtask-list li{padding:.3rem 0;font-size:.72rem;color:#bbb;display:flex;align-items:center;gap:.4rem}
.story-block .subtask-list li .st-key{color:#666;font-size:.65rem;min-width:48px}
.btn-detail{font-size:.68rem;color:#448AFF;cursor:pointer;text-decoration:underline}

@media(max-width:900px){.stats-row{grid-template-columns:repeat(3,1fr)}.three-col{grid-template-columns:1fr}.epic-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
    <div class="logos">
        <img src="gbm-logo.png" alt="GBM">
        <span class="divider"></span>
        <img src="aws-logo-white.png" alt="AWS">
    </div>
    <div style="text-align:right">
        <div class="title">Sprint Dashboard</div>
        <div class="sub">GBM — CC Fase II — Amazon Connect</div>
        <div class="updated" id="updated"></div>
    </div>
</div>

<div class="tabs">
    <div class="tab active" onclick="showView('daily')">Daily</div>
    <div class="tab" onclick="showView('sprint')">Sprint</div>
    <div class="tab" onclick="showView('epics')">Epicas</div>
    <div class="tab" onclick="showView('stories')">User Stories</div>
</div>

<div class="content">
    <!-- DAILY VIEW -->
    <div class="view active" id="view-daily">
        <div class="stats-row" id="stats-row"></div>
        <div class="three-col" id="three-col"></div>
    </div>

    <!-- SPRINT VIEW -->
    <div class="view" id="view-sprint">
        <div class="section">
            <div class="section-title"><span class="dot" style="background:#FF9900"></span> Progreso por Sprint</div>
            <table id="sprint-table"><thead><tr><th>Sprint</th><th>Progreso</th><th>%</th><th>Done/Total</th><th></th></tr></thead><tbody></tbody></table>
        </div>
        <div class="section" id="sprint-detail" style="display:none">
            <div class="section-title" id="sprint-detail-title"><span class="dot" style="background:#448AFF"></span> Detalle</div>
            <div id="sprint-detail-content"></div>
        </div>
    </div>

    <!-- EPICS VIEW -->
    <div class="view" id="view-epics">
        <div class="section">
            <div class="section-title"><span class="dot" style="background:#B388FF"></span> Progreso por Epica</div>
            <div class="epic-grid" id="epic-grid"></div>
        </div>
    </div>

    <!-- STORIES VIEW -->
    <div class="view" id="view-stories">
        <div class="section">
            <div class="section-title"><span class="dot" style="background:#22c55e"></span> User Stories (HUs)</div>
            <table id="stories-table"><thead><tr><th>Key</th><th>Story</th><th>Sprint</th><th>Due</th><th>Status</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>

<script>
function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('view-' + id).classList.add('active');
    event.target.classList.add('active');
}

function badge(status) {
    const cat = status.statusCategory.key;
    if (cat === 'done') return '<span class="badge badge-done">Done</span>';
    if (cat === 'indeterminate') return '<span class="badge badge-progress">In Progress</span>';
    return '<span class="badge badge-todo">To Do</span>';
}

function getSprint(labels) {
    const s = (labels || []).find(l => l.startsWith('sprint-'));
    return s ? s.replace('sprint-', 'S') : '-';
}

async function loadDashboard() {
    const resp = await fetch('data.json');
    const data = await resp.json();
    const issues = data.issues || [];

    const done = issues.filter(i => i.fields.status.statusCategory.key === 'done');
    const progress = issues.filter(i => i.fields.status.statusCategory.key === 'indeterminate');
    const todo = issues.filter(i => i.fields.status.statusCategory.key === 'new');
    const stories = issues.filter(i => i.fields.status && issues.some(c => c.fields.parent && c.fields.parent.key === i.key) || (i.key >= 'AC-450' && i.key <= 'AC-471') || (i.key >= 'AC-663'));
    const blocked = issues.filter(i => (i.fields.labels || []).includes('blocker'));

    // Stats
    document.getElementById('stats-row').innerHTML = `
        <div class="stat"><div class="val green">${done.length}</div><div class="lbl">Completadas</div></div>
        <div class="stat"><div class="val orange">${progress.length}</div><div class="lbl">En Progreso</div></div>
        <div class="stat"><div class="val blue">${todo.length}</div><div class="lbl">Por Hacer</div></div>
        <div class="stat"><div class="val red">${blocked.length}</div><div class="lbl">Bloqueadas</div></div>
        <div class="stat"><div class="val purple">${issues.length}</div><div class="lbl">Total</div></div>
    `;

    // Three columns: Done | In Progress | Blocked
    document.getElementById('three-col').innerHTML = `
        <div class="col-card">
            <h3><span class="dot" style="background:#22c55e"></span> Completadas (${done.length})</h3>
            <ul>${done.slice(0,15).map(i => `<li><span class="key">${i.key}</span>${i.fields.summary.substring(0,45)}</li>`).join('')}</ul>
        </div>
        <div class="col-card">
            <h3><span class="dot" style="background:#FF9900"></span> En Progreso (${progress.length})</h3>
            <ul>${progress.map(i => `<li><span class="key">${i.key}</span>${i.fields.summary.substring(0,45)}</li>`).join('')}${progress.length === 0 ? '<li style="color:#666">Ninguna</li>' : ''}</ul>
        </div>
        <div class="col-card">
            <h3><span class="dot" style="background:#ef4444"></span> Bloqueadas (${blocked.length})</h3>
            <ul>${blocked.map(i => `<li><span class="key">${i.key}</span>${i.fields.summary.substring(0,45)}</li>`).join('')}${blocked.length === 0 ? '<li style="color:#666">Ninguna</li>' : ''}</ul>
        </div>
    `;

    // Sprint table with clickable rows
    const sprintLabels = ['sprint-0','sprint-1','sprint-2','sprint-3','sprint-4','sprint-5','sprint-6','sprint-7','sprint-8'];
    const sprintNames = ['Sprint 0 - Discovery','Sprint 1 - Accesos','Sprint 2 - Refactor','Sprint 3 - Entity','Sprint 4 - Workspace','Sprint 5 - Routing','Sprint 6 - WhatsApp','Sprint 7 - Campaigns','Sprint 8 - CSAT+ACW'];
    let sprintHtml = '';
    sprintLabels.forEach((label, i) => {
        const si = issues.filter(x => (x.fields.labels || []).includes(label));
        const sd = si.filter(x => x.fields.status.statusCategory.key === 'done');
        const pct = si.length > 0 ? Math.round((sd.length / si.length) * 100) : 0;
        const color = pct === 100 ? 'fill-green' : pct > 0 ? 'fill-orange' : 'fill-blue';
        sprintHtml += `<tr class="sprint-row" onclick="showSprintDetail('${label}', '${sprintNames[i]}')">
            <td style="font-weight:500;color:#fff">${sprintNames[i]}</td>
            <td><div class="progress-bar"><div class="progress-fill ${color}" style="width:${pct}%"></div></div></td>
            <td style="font-family:'Sora';font-weight:600;color:${pct===100?'#22c55e':pct>0?'#FF9900':'#888'}">${pct}%</td>
            <td style="color:#888">${sd.length}/${si.length}</td>
            <td><span class="btn-detail">Ver detalle →</span></td>
        </tr>`;
    });
    document.querySelector('#sprint-table tbody').innerHTML = sprintHtml;

    // Store issues globally for sprint detail
    window._allIssues = issues;

    // Epics
    const epicKeys = ['AC-662','AC-443','AC-444','AC-445','AC-446','AC-447','AC-448','AC-449'];
    let epicHtml = '';
    epicKeys.forEach(ek => {
        const epic = issues.find(i => i.key === ek);
        if (!epic) return;
        const children = issues.filter(i => i.fields.parent && i.fields.parent.key === ek);
        const cd = children.filter(i => i.fields.status.statusCategory.key === 'done');
        const pct = children.length > 0 ? Math.round((cd.length / children.length) * 100) : 0;
        const color = pct === 100 ? 'fill-green' : pct > 0 ? 'fill-orange' : 'fill-blue';
        epicHtml += `<div class="epic-card">
            <div class="name">${epic.fields.summary}</div>
            <div class="meta">${cd.length}/${children.length} completadas (${pct}%)</div>
            <div class="progress-bar"><div class="progress-fill ${color}" style="width:${pct}%"></div></div>
        </div>`;
    });
    document.getElementById('epic-grid').innerHTML = epicHtml;

    // Stories table
    const storyIssues = issues.filter(i => {
        const key = parseInt(i.key.replace('AC-',''));
        return (key >= 450 && key <= 471) || key >= 663;
    }).filter(i => !i.fields.summary.startsWith('[Sprint'));
    let storiesHtml = '';
    storyIssues.forEach(i => {
        const sprint = getSprint(i.fields.labels);
        const due = i.fields.duedate || '-';
        storiesHtml += `<tr>
            <td class="key">${i.key}</td>
            <td>${i.fields.summary.substring(0,60)}</td>
            <td>${sprint}</td>
            <td style="color:#888;font-size:.7rem">${due}</td>
            <td>${badge(i.fields.status)}</td>
        </tr>`;
    });
    document.querySelector('#stories-table tbody').innerHTML = storiesHtml;

    document.getElementById('updated').textContent = 'Datos: ' + (data.generated || 'N/A');
}

loadDashboard();

function showSprintDetail(label, name) {
    const issues = window._allIssues || [];
    const sprintIssues = issues.filter(x => (x.fields.labels || []).includes(label));
    
    // Separate by type
    const stories = sprintIssues.filter(i => i.fields.issuetype && i.fields.issuetype.name === 'Story');
    const tasks = sprintIssues.filter(i => i.fields.issuetype && i.fields.issuetype.name === 'Task');
    
    // Find subtasks for each story/task
    let html = '';
    
    // Stories with their subtasks
    stories.forEach(story => {
        const subtasks = issues.filter(i => i.fields.parent && i.fields.parent.key === story.key);
        const stDone = subtasks.filter(s => s.fields.status.statusCategory.key === 'done').length;
        const statusBadge = story.fields.status.statusCategory.key === 'done' 
            ? '<span class="badge badge-done">Done</span>' 
            : story.fields.status.statusCategory.key === 'indeterminate'
            ? '<span class="badge badge-progress">In Progress</span>'
            : '<span class="badge badge-todo">To Do</span>';
        
        html += `<div class="story-block">
            <div class="story-title">
                <span class="type-icon" style="background:#22c55e"></span>
                <span class="key">${story.key}</span>
                ${story.fields.summary}
                ${statusBadge}
                ${story.fields.duedate ? '<span style="color:#888;font-size:.65rem;margin-left:auto"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" style="vertical-align:middle;margin-right:2px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+story.fields.duedate+'</span>' : ''}
        </div>
            ${subtasks.length > 0 ? `<ul class="subtask-list">
                ${subtasks.map(st => {
                    const stStatus = st.fields.status.statusCategory.key === 'done' ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>';
                    return `<li>${stStatus}<span class="st-key">${st.key}</span>${st.fields.summary}</li>`;
                }).join('')}
            </ul><div style="font-size:.65rem;color:#888;margin-top:.3rem">${stDone}/${subtasks.length} sub-tasks completadas</div>` : '<div style="font-size:.68rem;color:#666;margin-top:.3rem">Sin sub-tasks</div>'}
        </div>`;
    });
    
    // Tasks (not linked to stories)
    if (tasks.length > 0) {
        html += '<div style="margin-top:1rem"><div class="section-title" style="font-size:.78rem"><span class="dot" style="background:#448AFF"></span> Tasks</div>';
        tasks.forEach(task => {
            const subtasks = issues.filter(i => i.fields.parent && i.fields.parent.key === task.key);
            const statusBadge = task.fields.status.statusCategory.key === 'done' 
                ? '<span class="badge badge-done">Done</span>' 
                : task.fields.status.statusCategory.key === 'indeterminate'
                ? '<span class="badge badge-progress">In Progress</span>'
                : '<span class="badge badge-todo">To Do</span>';
            
            html += `<div class="story-block" style="border-left:3px solid #448AFF">
                <div class="story-title">
                    <span class="type-icon" style="background:#448AFF"></span>
                    <span class="key">${task.key}</span>
                    ${task.fields.summary}
                    ${statusBadge}
                </div>
                ${subtasks.length > 0 ? `<ul class="subtask-list">
                    ${subtasks.map(st => {
                        const stIcon = st.fields.status.statusCategory.key === 'done' ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>';
                        return `<li>${stIcon}<span class="st-key">${st.key}</span>${st.fields.summary}</li>`;
                    }).join('')}
                </ul>` : ''}
            </div>`;
        });
        html += '</div>';
    }
    
    document.getElementById('sprint-detail-title').innerHTML = `<span class="dot" style="background:#448AFF"></span> ${name} — Detalle`;
    document.getElementById('sprint-detail-content').innerHTML = html || '<p style="color:#666">Sin items en este sprint</p>';
    document.getElementById('sprint-detail').style.display = 'block';
    document.getElementById('sprint-detail').scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
